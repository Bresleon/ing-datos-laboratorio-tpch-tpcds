name: "Postgres TPC-H -> Local Storage"
prefix: "tpch_"
namespaceDefinition: "source"
status: "active"
scheduleType: "manual"
sourceConfig: "sources/postgres_tpch.yaml"
destinationConfig: "destinations/local_storage.yaml"
streams:
  - name: "nation"
    namespace: "public"
    syncMode: "full_refresh"
    destinationSyncMode: "overwrite"
  - name: "region"
    namespace: "public"
    syncMode: "full_refresh"
    destinationSyncMode: "overwrite"
  - name: "orders"
    namespace: "public"
    syncMode: "incremental"
    destinationSyncMode: "append"
    cursorField:
      - "o_orderdate"
    primaryKey:
      - - "o_orderkey"
