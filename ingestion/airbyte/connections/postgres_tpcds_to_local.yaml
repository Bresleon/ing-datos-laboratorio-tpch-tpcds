    namespace: "public"
    syncMode: "full_refresh"
    destinationSyncMode: "overwrite"
  - name: "item"
    namespace: "public"
    syncMode: "full_refresh"
    destinationSyncMode: "overwrite"
  - name: "store_sales"
    namespace: "public"
    syncMode: "full_refresh"
    destinationSyncMode: "overwrite"
